# Based on the workflow in Astro's GitHub Pages guide. Needs Settings > Pages >
# Source: GitHub Actions. The build runs every CI gate with the launch gate on,
# so nothing deploys while a claim is Unverified or a page is unfinished.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pushes deploy only after launch, when the repository variable
    # SITE_LAUNCHED is set to true; until then the launch gate would fail every
    # push. A manual run always builds, so the gate can be tried at any time.
    if: github.event_name == 'workflow_dispatch' || vars.SITE_LAUNCHED == 'true'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          build-cmd: pnpm run ci:launch

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
